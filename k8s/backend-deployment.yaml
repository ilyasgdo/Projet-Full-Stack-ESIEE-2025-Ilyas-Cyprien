apiVersion: apps/v1
kind: Deployment
metadata:
  name: quiz-backend
  namespace: default
  labels:
    app: quiz
    component: backend
spec:
  replicas: 1  # SQLite requires single writer
  selector:
    matchLabels:
      app: quiz
      component: backend
  template:
    metadata:
      labels:
        app: quiz
        component: backend
    spec:
      containers:
        - name: quiz-api
          image: ssssssss3/quiz-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
              protocol: TCP
          env:
            - name: FLASK_ENV
              valueFrom:
                configMapKeyRef:
                  name: quiz-config
                  key: FLASK_ENV
            - name: FLASK_DEBUG
              valueFrom:
                configMapKeyRef:
                  name: quiz-config
                  key: FLASK_DEBUG
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: quiz-secrets
                  key: SECRET_KEY
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: quiz-secrets
                  key: ADMIN_PASSWORD
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: db-storage
              mountPath: /app/instance
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: db-storage
          persistentVolumeClaim:
            claimName: quiz-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: quiz-backend
  namespace: default
  labels:
    app: quiz
    component: backend
spec:
  type: ClusterIP
  selector:
    app: quiz
    component: backend
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP
      name: http
