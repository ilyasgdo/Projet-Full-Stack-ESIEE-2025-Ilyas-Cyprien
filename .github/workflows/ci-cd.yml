name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  # Job 1: Run frontend unit tests
  test:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: quiz-ui/package-lock.json

      - name: 📚 Install dependencies
        run: npm ci
        working-directory: quiz-ui

      - name: 🧪 Run tests
        run: npm run test:run
        working-directory: quiz-ui

  # Job 2: Build and push Docker images
  build-and-push:
    name: 🐳 Build & Push Docker Images
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./quiz-api
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/quiz-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/quiz-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🐳 Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./quiz-ui
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/quiz-ui:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/quiz-ui:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=http://quiz-backend:5000

      - name: 📋 Summary
        run: |
          echo "## 🎉 Docker Images Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| quiz-api | latest, ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| quiz-ui | latest, ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
