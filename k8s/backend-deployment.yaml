apiVersion: apps/v1
kind: Deployment
metadata:
  name: quiz-backend
  namespace: default
  labels:
    app: quiz
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quiz
      component: backend
  template:
    metadata:
      labels:
        app: quiz
        component: backend
    spec:
      containers:
        - name: quiz-api
          # Replace YOUR_DOCKERHUB_USERNAME with your actual Docker Hub username
          image: YOUR_DOCKERHUB_USERNAME/quiz-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
              protocol: TCP
          env:
            - name: FLASK_ENV
              valueFrom:
                configMapKeyRef:
                  name: quiz-config
                  key: FLASK_ENV
            - name: FLASK_DEBUG
              valueFrom:
                configMapKeyRef:
                  name: quiz-config
                  key: FLASK_DEBUG
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: quiz-secrets
                  key: SECRET_KEY
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: quiz-secrets
                  key: ADMIN_PASSWORD
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: quiz-backend
  namespace: default
  labels:
    app: quiz
    component: backend
spec:
  type: ClusterIP
  selector:
    app: quiz
    component: backend
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP
      name: http
