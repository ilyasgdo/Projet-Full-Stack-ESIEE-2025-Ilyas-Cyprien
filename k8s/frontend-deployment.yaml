apiVersion: apps/v1
kind: Deployment
metadata:
  name: quiz-frontend
  namespace: default
  labels:
    app: quiz
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quiz
      component: frontend
  template:
    metadata:
      labels:
        app: quiz
        component: frontend
    spec:
      containers:
        - name: quiz-ui
          image: ssssssss3/quiz-ui:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: quiz-frontend
  namespace: default
  labels:
    app: quiz
    component: frontend
spec:
  type: NodePort
  selector:
    app: quiz
    component: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      protocol: TCP
      name: http
