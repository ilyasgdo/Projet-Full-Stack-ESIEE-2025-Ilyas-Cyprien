name: Deploy Frontend to Cloudflare Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'quiz-ui/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: quiz-ui/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: quiz-ui

      - name: Build for production
        run: npm run build
        working-directory: quiz-ui
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy quiz-ui/dist --project-name=quiz-frontend --commit-dirty=true

      - name: Deployment Summary
        run: |
          echo "## Frontend Deployed 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Frontend has been deployed to Cloudflare Pages" >> $GITHUB_STEP_SUMMARY
          echo "- **Domain**: https://ilyasghandaoui.store" >> $GITHUB_STEP_SUMMARY
